[package]
name = "camship"
description = "X-Plane plugin: a cinematic camera that cuts between moving air-to-air shots"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", default-features = false }
camship-core = { path = "../core" }

[package]
name = "camship-msfs"
description = "Camship for Microsoft Flight Simulator 2024: a cinematic camera driven over SimConnect"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "camship-msfs"
path = "src/main.rs"

[dependencies]
camship-core = { path = "../core" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
